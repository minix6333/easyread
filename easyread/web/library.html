<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOLI</title>
<link rel="icon" href="/web/logo.svg">
<link rel="stylesheet" href="/web/css/base.css">
<link rel="stylesheet" href="/web/css/glass.css">
<link rel="stylesheet" href="/web/css/library.css">
<link rel="stylesheet" href="/web/css/cite-export.css">
<link rel="stylesheet" href="/web/css/batch.css">
<link rel="stylesheet" href="/web/css/settings.css">
<link rel="stylesheet" href="/web/css/page-cap.css">
<link rel="stylesheet" href="/web/css/settings-cloud.css">
<link rel="stylesheet" href="/web/css/usage.css">
<link rel="stylesheet" href="/web/css/apple.css">
<script>try{var p=JSON.parse((localStorage.getItem("easyread-prefs")||localStorage.getItem("coread-prefs"))||"{}");var d=p.theme==="dark"||(p.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <button class="btn icon" id="sideBtn" title="側欄"></button>
  <span class="grow"></span>
  <label class="search">
    <span class="si"></span>
    <input id="q" type="search" placeholder="搜尋" autocomplete="off">
  </label>
  <span class="grow"></span>
  <button class="engine-chip" id="engineChip" hidden></button>
  <button class="btn icon sync-btn" id="syncBtn" hidden></button>
  <button class="btn icon lang-btn" id="langBtn" hidden></button>
  <button class="btn icon" id="importBtn"></button>
  <button class="btn icon" id="settingsBtn" title="设置"></button>
</header>

<div class="lib">
  <nav class="side" id="side"></nav>
  <main class="main">
    <div class="list-head">
      <h1 id="viewTitle">全部论文</h1>
      <span class="count" id="count"></span>
      <span class="grow"></span>
      <button class="btn sm line" id="pickBtn" disabled></button>
      <div class="batch-bar" id="batchBar"></div>
      <label class="sort">排序
        <select id="sort" class="input">
          <option value="opened">最近打开</option>
          <option value="added">最近添加</option>
          <option value="year">发表年份</option>
          <option value="title">标题</option>
        </select>
      </label>
    </div>
    <div id="list" class="list" role="listbox" tabindex="0"></div>
  </main>
  <aside class="detail" id="detail"></aside>
</div>

<div class="drop-overlay" id="dropOverlay"><div><div class="big">松手导入</div><div class="hint">可以一次拖多个 PDF</div></div></div>

<div class="dialog-backdrop" id="importDlg"><div class="dialog" role="dialog" aria-label="导入论文"></div></div>
<div class="dialog-backdrop" id="settingsDlg"><div class="dialog wide" role="dialog" aria-label="设置"></div></div>
<div class="dialog-backdrop" id="trashDlg"><div class="dialog wide" role="dialog" aria-label="回收站"></div></div>
<div class="dialog-backdrop" id="textDlg"><div class="dialog wide" role="dialog"></div></div>
<div class="dialog-backdrop" id="citeExportDlg"><div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="citeExportTitle"></div></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
<div id="toast" role="status"></div>

<script src="/web/js/common/i18n.js"></script>
<script src="/web/js/common/util.js"></script>
<script src="/web/vendor/liquid-glass.js"></script>
<script src="/web/js/common/glass.js"></script>
<script src="/web/js/common/ui.js"></script>
<script src="/web/js/common/frame-bridge.js"></script>
<script src="/web/js/common/library-nav.js"></script>
<script src="/web/js/common/presence.js"></script>
<script src="/web/js/common/confirm.js"></script>
<script src="/web/js/common/features.js"></script>
<script src="/web/js/common/usage.js"></script>
<script src="/web/js/common/theme.js"></script>
<script src="/web/js/common/lang-toggle.js"></script>
<script src="/web/js/library/app.js"></script>
<script src="/web/js/common/cite.js"></script>
<script src="/web/js/common/cite-zotero.js"></script>
<script src="/web/js/common/page-cap.js"></script>
<script src="/web/js/library/cite-export.js"></script>
<script src="/web/js/library/batch.js"></script>
<script src="/web/js/library/sidebar.js"></script>
<script src="/web/js/library/side-toggle.js"></script>
<script src="/web/js/library/detail.js"></script>
<script src="/web/js/library/import.js"></script>
<script src="/web/js/common/settings-models.js"></script>
<script src="/web/js/common/settings-api.js"></script>
<script src="/web/js/common/settings.js"></script>
<script src="/web/js/common/settings-tabs.js"></script>
<script src="/web/js/common/settings-chat.js"></script>
<script src="/web/js/library/settings-library.js"></script>
<script src="/web/js/library/migrate-dialog.js"></script>
<script src="/web/js/library/settings-cloud.js"></script>
<script src="/web/js/library/sync-status.js"></script>
<script src="/web/js/library/help.js"></script>
<script src="/web/js/library/update.js"></script>
<script src="/web/js/library/trash.js"></script>
</body>
</html>
