<script>try{var p=JSON.parse((localStorage.getItem("easyread-prefs")||localStorage.getItem("coread-prefs"))||"{}");var d=p.theme==="dark"||(p.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";if(p.accent&&p.accent!=="violet")document.documentElement.dataset.accent=p.accent;if(p.clear!=null)document.documentElement.style.setProperty("--clear",p.clear);if(p.paper&&p.paper!=="white")document.documentElement.dataset.paper=p.paper;if(p.tint)document.documentElement.style.setProperty("--tint",p.tint);if(p.hl)document.documentElement.style.setProperty("--hl-k",p.hl/100);if(p.skin){document.documentElement.dataset.skin=p.skin;if(p.skin==="custom"&&p.skinVars)document.documentElement.style.cssText+=";"+p.skinVars}var b=p.backdrop||"auto";if(b==="image"&&location.protocol==="file:")b="auto";if(b!=="none"){document.documentElement.dataset.backdrop=b;if(b==="image"){var u="?v="+(p.backdropV||0);document.documentElement.style.setProperty("--bd",'url("/backdrop.jpg'+u+'") center / cover no-repeat');document.documentElement.style.setProperty("--bd-s",'url("/backdrop-s.jpg'+u+'") center / cover no-repeat')}}}catch(e){}if(/Electron/i.test(navigator.userAgent)&&/Mac/i.test(navigator.userAgent))document.documentElement.classList.add("desktop");try{if(window.parent!==window)document.documentElement.classList.add("framed")}catch(e){}</script>
